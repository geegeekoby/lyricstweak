# LyricsTweak -- build and publish.
#
# Paste this whole file into your GitHub repository as:
#
#     .github/workflows/build.yml
#
# It is the only file the repository needs. The tweak's source does not live on GitHub -- it lives
# in the git remote the library site deploys from, which a build runner cannot clone -- so this
# workflow asks the site for the source, builds the .deb on a macOS runner, and posts it back to
# the site's package repository. Sileo and Zebra then see the new build straight away: no tag, no
# commit, no redeploy.
#
# Builds start three ways: a push to main here, the "Run workflow" button in the Actions tab, and
# the site itself, which dispatches this workflow whenever it publishes a deploy -- because a
# deploy is what changes the source this build fetches. That last one needs a token on the site
# rather than anything here; the site's README covers it.
#
# Version numbers are not edited here or on GitHub. The site is asked what to build as at the same
# moment it is asked for the source: `control` holds the release number a person sets, and the build
# revision after it moves on its own when the source changes without that number changing. A rebuild
# over source that has not changed keeps its version, so re-running this workflow does not ask every
# phone to reinstall a package it already has.
#
# One secret is required, under Settings -> Secrets and variables -> Actions -> Secrets:
#
#     REPO_PUBLISH_TOKEN   the same value the site has for REPO_PUBLISH_TOKEN
#
# It authenticates both halves: fetching the source, and publishing the result. A repository
# variable of that name is not used and does not stand in for the secret.
#
# The source is never committed here, and the last job deletes it if it ever was: a repository
# that once held the tweak's source cleans itself out the first time it publishes successfully,
# and from then on holds nothing but this file. That is the point of fetching the source at build
# time -- one copy, on the site, with the build borrowing it for the length of a job.

name: build

on:
  push:
    branches: [main]
  # How the site starts a build. Publishing a deploy changes the source this workflow will fetch,
  # so the site dispatches this workflow when that happens -- the same request the "Run workflow"
  # button makes. It is also that button, so removing this line takes both away.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tweak:
    name: tweak (.deb)
    runs-on: macos-14
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The source, from the site this build publishes to. Unpacked with node rather than tar so
      # that nothing has to be installed before the source exists, and each path is checked to be
      # inside the workspace before it is written.
      - name: Fetch the tweak source
        env:
          REPO_PUBLISH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
          REPO_PUBLISH_URL: ${{ vars.REPO_PUBLISH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_PUBLISH_TOKEN:-}" ]; then
            echo "REPO_PUBLISH_TOKEN is not set on this repository." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions -> Secrets." >&2
            exit 1
          fi
          site="${REPO_PUBLISH_URL:-https://scintillating-pie-1f0e65.netlify.app}"
          site="${site%/}"
          curl -fsS --retry 3 --retry-delay 5 \
            -H "authorization: Bearer $REPO_PUBLISH_TOKEN" \
            "$site/repo/source" -o "$RUNNER_TEMP/source.json"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!payload.ok) throw new Error(payload.error || "the site refused the source request");
            const root = process.cwd();
            for (const [rel, b64] of Object.entries(payload.files)) {
              const out = path.resolve(root, rel);
              if (!out.startsWith(root + path.sep)) throw new Error("refusing path " + rel);
              fs.mkdirSync(path.dirname(out), { recursive: true });
              fs.writeFileSync(out, Buffer.from(b64, "base64"));
            }
            console.log("unpacked " + payload.count + " files, version " + payload.version);
            // The version this build goes out as is decided by the site, not by this file. It
            // knows what is already published and whether these exact inputs are what produced
            // it, which is what separates "the code changed and control was not touched" from
            // "somebody re-ran the build over the same commit". The control file that gets
            // packaged is rewritten to match, so the version in the index and the version
            // recorded inside the .deb are the same string -- if they ever differed, a phone
            // would install the update and keep being offered it forever.
            const build = payload.buildVersion || payload.version;
            if (!build) throw new Error("the site did not say what version to build");
            if (build !== payload.version) {
              const controlPath = path.join(root, "control");
              const control = fs.readFileSync(controlPath, "utf8");
              const rewritten = control.replace(/^Version:.*$/m, "Version: " + build);
              if (rewritten === control) throw new Error("control has no Version line to set");
              fs.writeFileSync(controlPath, rewritten);
            }
            console.log("building as " + build + " -- " + (payload.versionReason || "no reason given"));
            // Handed to the publish step through the job environment, and from there recorded
            // against the published package. It is what the next build compares against.
            if (payload.sourceHash && process.env.GITHUB_ENV) {
              fs.appendFileSync(process.env.GITHUB_ENV, "LT_SOURCE_HASH=" + payload.sourceHash + "\n");
            }
          ' "$RUNNER_TEMP/source.json"
          rm -f "$RUNNER_TEMP/source.json"
          for required in Makefile control Tweak.xm scripts/publish-deb.mjs; do
            test -f "$required" || { echo "the site did not send $required" >&2; exit 1; }
          done

      # ldid signs the dylib, dpkg builds the archive, and xz is what dpkg-deb compresses with.
      # None of them ship with the runner. A tool that is already there is left alone, and Homebrew
      # is told not to update itself before installing -- on a hosted runner that update is most of
      # what this step used to cost, and it is spent to learn nothing about three pinned formulae.
      - name: Install packaging tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          missing=""
          for tool in ldid dpkg xz; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -z "$missing" ]; then
            echo "ldid, dpkg and xz are all installed already."
          else
            brew install $missing
          fi

      # Theos and the SDK are the same bytes on every run, and fetching them again each time is the
      # bulk of this job: the toolchain is a recursive clone, and theos/sdks is a repository of
      # entire SDKs. A hosted runner is destroyed when the job ends, so nothing can be installed on
      # one permanently -- but the Actions cache carries the installed tree from run to run, which
      # buys the same thing. On a hit it restores a single archive in seconds and the two install
      # steps below are skipped outright.
      #
      # Nothing in the key moves, so the cached toolchain is a pinned toolchain: every build uses
      # the Theos and SDK that the first run after this key appeared installed, rather than whatever
      # theos/theos is on the day -- which is also why a green build stays green. To move to a newer
      # Theos, raise the `-v1` at the end of the key; the next run installs from scratch and caches
      # that instead.
      #
      # Restoring and saving are separate steps on purpose. The plain cache action saves whatever
      # the path holds when the job ends, including after a failure -- so a clone that died halfway
      # would be saved, restored by every run after it, and fail each one until somebody worked out
      # that the key needed raising. The save is down at the bottom instead, where a build has
      # already shipped a .deb built with this toolchain.
      - name: Restore cached Theos and iOS SDK
        id: theos-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-iPhoneOS16.5-v1

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$HOME/theos"
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      # Theos needs a patched SDK. The private headers come from Theos itself, but this SDK is the
      # only place the Preferences framework stub exists, and the settings bundle links against it.
      # One SDK is taken out of a repository that holds many: with blobs fetched on demand and a
      # sparse checkout, a cold run downloads the one it will use rather than all of them. Should a
      # runner's git not manage that, the plain clone still works and only costs time.
      - name: Install the iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/theos/sdks"
          sdks="$RUNNER_TEMP/theos-sdks"
          rm -rf "$sdks"
          if git clone --quiet --depth 1 --filter=blob:none --sparse \
               https://github.com/theos/sdks.git "$sdks" \
             && git -C "$sdks" sparse-checkout set iPhoneOS16.5.sdk \
             && [ -d "$sdks/iPhoneOS16.5.sdk" ]; then
            echo "Took iPhoneOS16.5.sdk on its own."
          else
            echo "A sparse checkout did not work here; cloning the whole repository instead."
            rm -rf "$sdks"
            git clone --quiet --depth 1 https://github.com/theos/sdks.git "$sdks"
          fi
          cp -r "$sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          rm -rf "$sdks"

      # /var/theos is where Theos installs by default and where the Makefile expects it, and it is
      # not a path the cache can keep -- so the cached tree lives in the home directory and
      # /var/theos points at it. make reads straight through the symlink, so neither the Makefile
      # nor the local build instructions in the README change. A runner that already has a real
      # /var/theos -- a self-hosted one, say -- keeps what it has.
      - name: Put Theos where the Makefile expects it
        run: |
          set -euo pipefail
          if [ -L /var/theos ]; then
            sudo rm -f /var/theos
          fi
          if [ -d /var/theos ]; then
            echo "/var/theos is a real directory on this runner; using it as it stands."
          else
            sudo ln -s "$HOME/theos" /var/theos
          fi
          # The prefs bundle links against the Preferences stub that only this SDK carries, and the
          # Makefile names 16.5 exactly so the runner's newer Xcode SDK cannot be chosen instead.
          # Checking for the stub here turns a missing SDK -- or a cache saved from a half-finished
          # install -- into a one-line failure rather than a linker error several minutes into the
          # build, and it is checked through /var/theos so the symlink is proved at the same time.
          stub=/var/theos/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd
          test -f "$stub" || { echo "The installed SDK has no Preferences stub at $stub." >&2; exit 1; }

      - name: Build
        run: |
          set -euo pipefail
          # FINALPACKAGE strips the binary and turns off debug logging; rootless is the packaging
          # scheme the Makefile already declares, restated so a change there is visible here.
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages

      # Kept so a build can be installed by hand as well, though it needs a logged-in GitHub
      # session to download -- which is exactly why publishing to the site is the step that
      # matters.
      - uses: actions/upload-artifact@v4
        with:
          name: LyricsTweak-deb
          path: packages/*.deb
          if-no-files-found: error

      # The site stores the bytes it is handed and measures those same bytes, so this is the whole
      # of publishing: Size and SHA256 in the package index describe exactly what the download
      # will hand back.
      - name: Publish to the repository
        env:
          REPO_PUBLISH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
          REPO_PUBLISH_URL: ${{ vars.REPO_PUBLISH_URL }}
          # Set by the fetch step, through the job environment. The publish script sends it on so
          # the repository remembers which inputs this version was built from.
          LT_SOURCE_HASH: ${{ env.LT_SOURCE_HASH }}
        run: |
          set -euo pipefail
          deb="$(ls -t packages/*.deb | head -n1)"
          node scripts/publish-deb.mjs "$deb"

      # Saved here rather than by the restore step above, so that what gets cached is a toolchain
      # that just built and published the tweak. It only runs when the restore missed -- a key that
      # is already in the cache cannot be written over -- and it sits after the publish so that
      # uploading a few hundred megabytes never delays the .deb reaching a phone.
      - name: Cache the toolchain for the next build
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-iPhoneOS16.5-v1

      # The source was a loan for the length of this job, so it goes back once the .deb is built
      # and published. On a hosted runner the whole workspace is discarded a moment later and this
      # changes nothing; on a self-hosted runner the workspace is reused, and there it is the
      # difference between the source living on one machine and living on two.
      - name: Remove the borrowed source
        if: always()
        run: |
          rm -rf Sources Preferences scripts control Makefile Tweak.xm LyricsTweak.plist .theos

  # Deletes the tweak's source from this repository, if a copy was ever committed to it.
  #
  # `needs: tweak` is what makes this safe to do: that job ends with the publish, so by the time
  # this one starts the .deb is already the one the site is serving and the source here is a
  # duplicate of a file the build can fetch again. A repository that holds no source -- the normal
  # case, and what this workflow expects -- finds nothing to delete and says so.
  #
  # The push is made with GITHUB_TOKEN, and a push made with GITHUB_TOKEN does not start another
  # workflow run, so this cannot set itself off again.
  purge:
    name: remove the source from this repository
    needs: tweak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete any committed source
        run: |
          set -euo pipefail
          tracked=()
          for path in control Makefile Tweak.xm LyricsTweak.plist Sources Preferences scripts; do
            if [ -n "$(git ls-files -- "$path")" ]; then tracked+=("$path"); fi
          done
          if [ ${#tracked[@]} -eq 0 ]; then
            echo "No tweak source is committed here, which is how it should be."
            exit 0
          fi
          echo "Removing: ${tracked[*]}"
          git rm -r --quiet "${tracked[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Remove the tweak source from this repository" -m \
            "The build fetches the source from the site with the publish token, so this copy was a second copy that could only drift. The site keeps the one that counts."
          # A push can lose a race with another push to the same branch; rebasing and retrying is
          # cheaper than failing a build over a deletion that will still be valid in a second.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git pull --rebase --quiet origin "${{ github.ref_name }}"
          done
          echo "Could not push the removal." >&2
          exit 1
